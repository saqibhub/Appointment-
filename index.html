 <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>For You ☕</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet" />
</head>
<body>

  <div class="bg">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
  </div>

  <main class="stage">

    <!-- 1. COMPLIMENT -->
    <section class="screen" id="compliment-screen">
      <div class="card">
        <span class="emoji">✨</span>
        <h1 class="title">Hey beautiful cheerypieww</h1>
        <p class="lead" id="compliment-text"></p>
        <button class="btn" id="next-to-invite">Continue</button>
      </div>
    </section>

    <!-- 2. INVITATION -->
    <section class="screen hidden" id="invite-screen">
      <div class="card">
        <span class="emoji">☕</span>
        <h1 class="title">A quiet invitation from Saqib ali</h1>
        <p class="secondary">Would you like to have a warm cup of coffee with me?</p>
        <button class="btn" id="next-to-date">Yes, I’d love that</button>
        <button class="btn btn-soft" id="maybe-btn">Maybe later…</button>
      </div>
    </section>

    <!-- 3. DATE -->
    <section class="screen hidden" id="date-screen">
      <div class="card">
        <span class="emoji">📅</span>
        <h1 class="title">When would you like?</h1>
        <div class="options" id="date-options">
          <button class="option-btn" data-date="This Weekend">This Weekend</button>
          <button class="option-btn" data-date="Next Week">Next Week</button>
          <button class="option-btn" data-date="Whenever you're free">Whenever you're free</button>
          <button class="option-btn" data-date="You decide">You decide the day</button>
        </div>
      </div>
    </section>

    <!-- 4. PLACE -->
    <section class="screen hidden" id="place-screen">
      <div class="card">
        <span class="emoji">📍</span>
        <h1 class="title">Where in Delhi?</h1>
        <div class="options" id="place-options">
          <button class="option-btn" data-place="Khan Market">Khan Market</button>
          <button class="option-btn" data-place="Connaught Place">Connaught Place</button>
          <button class="option-btn" data-place="Hauz Khas Village">Hauz Khas Village</button>
          <button class="option-btn" data-place="Saket">Saket</button>
          <button class="option-btn" data-place="You choose">You choose the café</button>
        </div>
      </div>
    </section>

    <!-- 5. FINAL -->
    <section class="screen hidden" id="final-screen">
      <div class="card">
        <span class="emoji">🎉</span>
        <h1 class="title">It’s a coffee date!</h1>
        <p class="secondary">Here’s what you chose</p>

        <div class="summary">
          <div><strong>Date:</strong> <span id="chosen-date">—</span></div>
          <div><strong>Place:</strong> <span id="chosen-place">—</span></div>
        </div>

   <button class="btn" id="finish-btn">Confirm on Instagram 📸</button>
      </div>
    </section>

    <!-- MAYBE -->
    <section class="screen hidden" id="maybe-screen">
      <div class="card">
        <span class="emoji">🌙</span>
        <h1 class="title">No rush</h1>
        <p class="secondary">Whenever you’re ready, I’m here.</p>
        <button class="btn btn-soft" id="back-from-maybe">Back</button>
      </div>
    </section>

  </main>

  <script src="script.js"></script>
</body>
</html>
